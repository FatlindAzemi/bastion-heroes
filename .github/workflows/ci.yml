# Continuous integration (spec 13.2 and 14 row 0.4): every pull request and every
# push to main runs the checks and the Playwright smoke test, and keeps the
# screenshots/report as artifacts (spec 13.7, 16.5).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-e2e:
    name: check-and-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run checks (typecheck, lint, unit tests, validate-data)
        run: npm run check

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7
