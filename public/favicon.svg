<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Bastion Heroes favicon: the simplified crest mark of the app icon.
    A golden heater shield with a dark battlement keep and a teal essence gem, on the
    midnight indigo/violet field. Tuned to stay crisp at 16 x 16 and 32 x 32 px.
    Hand-authored for this project (no third-party assets).
  -->
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#453A85" />
      <stop offset="0.45" stop-color="#241D4A" />
      <stop offset="1" stop-color="#0F0C22" />
    </linearGradient>
    <radialGradient id="halo" cx="0.44" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#8A5CFF" stop-opacity="0.5" />
      <stop offset="1" stop-color="#5A35C4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0.12" y1="0" x2="0.84" y2="1">
      <stop offset="0" stop-color="#FFF6C4" />
      <stop offset="0.28" stop-color="#FFDE72" />
      <stop offset="0.58" stop-color="#FFC12E" />
      <stop offset="0.82" stop-color="#EF9A08" />
      <stop offset="1" stop-color="#B96800" />
    </linearGradient>
    <linearGradient id="goldTrim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3B0" />
      <stop offset="0.5" stop-color="#FFC12E" />
      <stop offset="1" stop-color="#8F5300" />
    </linearGradient>
    <linearGradient id="tower" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#37306B" />
      <stop offset="0.55" stop-color="#211A45" />
      <stop offset="1" stop-color="#0E0A1F" />
    </linearGradient>
    <linearGradient id="gem" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#D6FFF7" />
      <stop offset="0.35" stop-color="#7CFFE4" />
      <stop offset="0.7" stop-color="#3BF0C8" />
      <stop offset="1" stop-color="#0E9C85" />
    </linearGradient>
    <radialGradient id="gemGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7CFFE4" stop-opacity="0.85" />
      <stop offset="1" stop-color="#3BF0C8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)" />
  <rect width="64" height="64" rx="15" fill="url(#halo)" />

  <!-- Golden heater shield, scaled up so the mark stays bold at 16 x 16. -->
  <path
    d="M 32 4.5
       C 42.5 4.5 50.5 7 53.5 9.2
       Q 56.5 11 56.5 15
       L 56.2 29.5
       C 55.5 41.5 47 52 32 60
       C 17 52 8.5 41.5 7.8 29.5
       L 7.5 15
       Q 7.5 11 10.5 9.2
       C 13.5 7 21.5 4.5 32 4.5 Z"
    fill="url(#gold)"
    stroke="#141326"
    stroke-width="4.5"
    stroke-linejoin="round"
  />
  <path
    d="M 12 15
       Q 12.5 11.5 16 10
       C 19.5 8.2 25 7.2 29.5 7.1"
    fill="none"
    stroke="#FFF6C4"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.8"
  />

  <!-- Battlement keep silhouette. -->
  <path
    d="M 21.5 47.5
       L 22.2 30
       V 25.5 H 26.4 V 30
       H 30.25 V 25.5 H 34.45 V 30
       H 38.3 V 25.5 H 42.5 V 30
       L 43.2 47.5
       Q 43.2 49.8 40.7 49.8 H 24 Q 21.5 49.8 21.5 47.5 Z"
    fill="url(#tower)"
    stroke="#0A0817"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <path
    d="M 22.2 30 V 25.5 H 26.4 V 30 H 30.25 V 25.5 H 34.45 V 30 H 38.3 V 25.5 H 42.5 V 30"
    fill="none"
    stroke="#8A79E8"
    stroke-width="1.3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.7"
  />
  <rect x="19" y="46.6" width="26" height="4.6" rx="1.8" fill="url(#goldTrim)" stroke="#141326" stroke-width="1.6" />

  <!-- Essence gem in a gold setting. -->
  <circle cx="32" cy="38.5" r="7.2" fill="url(#gemGlow)" />
  <circle cx="32" cy="38.5" r="6.6" fill="url(#goldTrim)" stroke="#141326" stroke-width="1.8" />
  <circle cx="32" cy="38.5" r="4.9" fill="#17112E" />
  <path d="M 32 34 L 36 38.5 L 32 43 L 28 38.5 Z" fill="url(#gem)" stroke="#141326" stroke-width="1.6" stroke-linejoin="round" />
  <path d="M 32 34 L 28 38.5 L 32 40.4 L 36 38.5 Z" fill="#D6FFF7" opacity="0.8" />

  <!-- Key light glints. -->
  <path d="M 51.5 12 Q 52.6 14.2 54.8 14.8 Q 52.6 15.4 51.5 17.6 Q 50.4 15.4 48.2 14.8 Q 50.4 14.2 51.5 12 Z" fill="#FFE58C" />
  <circle cx="11.5" cy="33" r="1.4" fill="#FFE58C" opacity="0.85" />
</svg>
